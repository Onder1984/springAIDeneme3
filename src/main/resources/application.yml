server:
  port: 8082

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: tactical-ew-copilot-3

  datasource:
    url: jdbc:postgresql://localhost:5432/tactical_ew_db_3
    username: ew_admin
    password: ew_secret_password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 25
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  ai:
    model:
      chat: google-genai
    google:
      genai:
        api-key: ${GEMINI_API_KEY:${GOOGLE_API_KEY:}}
        chat:
          options:
            model: gemini-3.5-flash-lite
            temperature: 0.1

logging:
  level:
    root: INFO
    com.c2.ew: DEBUG
    org.springframework.ai: INFO
    org.hibernate.SQL: WARN

tactical:
  streamer:
    enabled: true
    interval-ms: 5000
    batch-size: 6
